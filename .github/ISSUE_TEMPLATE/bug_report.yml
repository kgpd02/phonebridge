name: Bug report
description: Report a reproducible PhoneBridge problem.
body:
  - type: markdown
    attributes:
      value: Never include passwords, verification codes, account details, cookies, IPA files or full device identifiers.
  - type: input
    id: versions
    attributes:
      label: PhoneBridge, macOS and iOS versions
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Redacted error message
